# serve-net 0.3.0 as published on crates.io (commit dae0c86), reduced to what
# the H6 build needs. See vendor/README.md: the only change that matters is
# the http-net requirement below, 0.6 upstream.
[package]
name    = "serve-net"
version = "0.3.0"
rust-version = "1.85"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "serve_net"
path = "src/lib.rs"

[features]
default = ["http1"]
http1 = ["dep:http-net"]

[dependencies]
net-io = "0.3"
http-net = { version = "0.9", default-features = false, optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(serve_net_loom)"] }
