# =============================================================================
#  http-net-bench
# =============================================================================
#
# Competitor benchmarks for http-net (spec section 11.3, workloads H1-H6).
#
# This repository exists so that http-net itself never depends on tokio,
# hyper, or httparse. Those crates are allowed here and only here. http-net
# is taken from crates.io, never by path: each repository is checked out on
# its own in CI.
[package]
name    = "http-net-bench"
version = "0.1.0"
publish = false

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "MIT OR Apache-2.0"

# Readme
readme = "README.md"

# Description
description = "Independent, reproducible benchmarks of http-net against httparse, hyper, picohttpparser, and llhttp on identical input bytes."

# Authors
authors = ["James Gober <me@jamesgober.com>"]


# DEPENDENCIES
# #################################
# The shared harness in src/ (inputs, the httparse framing pass, the hyper
# and tokio drivers) is used by both the benches and tests/equivalence.rs,
# so the competitors are ordinary dependencies of this unpublished crate.
[dependencies]
http-net       = "0.9"
httparse       = "1.10"
hyper          = { version = "1", features = ["server", "client", "http1"] }
# `TokioIo`, the standard adapter between tokio's and hyper's I/O traits.
hyper-util     = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes          = "1"
# Current-thread runtime only (no `rt-multi-thread`).
tokio          = { version = "1", features = ["rt", "io-util", "macros"] }
# H6 only, behind the `h6` feature: the competitor servers stay out of the
# H1-H5 build.
serve-net      = { version = "0.6", default-features = false, features = ["http1"], optional = true }
actix-web      = { version = "4", default-features = false, optional = true }
may_minihttp   = { version = "0.1", optional = true }
may            = { version = "0.3", optional = true }


# BUILD DEPENDENCIES
# #################################
[build-dependencies]
# Compiles the vendored C parsers (build.rs).
cc = "1"


# FEATURES
# #################################
[features]
# The socket workload's servers (`h6_server`) and their equivalence checks.
h6 = ["dep:serve-net", "dep:actix-web", "dep:may_minihttp", "dep:may", "tokio/net"]


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }


# LINTS
# #################################
[lints.rust]
# `scripts/run.sh` builds a second time with
# RUSTFLAGS='--cfg httparse_disable_simd="1"' (the form httparse 1.10's build
# script actually honours); the harness reads the same cfg to label results.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(httparse_disable_simd, values("1"))'] }


# BINARIES
# #################################
# H6 runs in two processes, so it is not a criterion bench: scripts/run.sh
# pins `h6_server` to one core and `h6_load` to others.
[[bin]]
name = "h6_server"
path = "src/bin/h6_server.rs"
required-features = ["h6"]

[[bin]]
name = "h6_load"
path = "src/bin/h6_load.rs"


# BENCHMARKS
# #################################
[[bench]]
name    = "h1_head"
harness = false

[[bench]]
name    = "h2_exchange"
harness = false

[[bench]]
name    = "h3_response"
harness = false

[[bench]]
name    = "h4_chunked"
harness = false

[[bench]]
name    = "h5_pipelined"
harness = false


# PROFILES
# #################################
# The same code generation settings as http-net's release profile, so the
# numbers here are comparable with http-net's own `cargo bench`.
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
debug         = false

[profile.bench]
inherits = "release"
